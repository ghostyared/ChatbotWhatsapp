# /Proyectos_Dockers/deployments/PROD_NGINX/NginxConfig/QA_ChatBot.conf
# Reemplaza qa-chatbot.tudominio.com por tu dominio y ajusta las rutas de los certificados
# (las del contenedor nginx; copia el patrón de tus otros .conf).
# nginx y el contenedor "qa_chatbot" deben estar en la red externa proxy-net.

server {
    listen 80;
    server_name qa-chatbot.tudominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name qa-chatbot.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/qa-chatbot.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qa-chatbot.tudominio.com/privkey.pem;

    client_max_body_size 6m;   # subida de Excel (la app limita a 5 MB)

    # Resolución dinámica: nginx arranca aunque qa_chatbot aún no exista y sigue la IP si se recrea el contenedor
    resolver 127.0.0.11 valid=10s;
    set $chatbot http://qa_chatbot:5005;

    location / {
        proxy_pass $chatbot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}
